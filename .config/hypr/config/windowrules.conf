# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Windowrules Configuration                ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# Float Necessary Windows
windowrule = float on, match:class org.pulseaudio.pavucontrol
windowrule = float on, match:title Picture in picture
windowrule = float on, match:title Save File
windowrule = float on, match:title Open File
windowrule = float on, match:class LibreWolf, match:title Picture-in-Picture
windowrule = float on, match:class blueman-manager
windowrule = float on, match:class xdg-desktop-portal-gtk
windowrule = float on, match:class xdg-desktop-portal-kde
windowrule = float on, match:class xdg-desktop-portal-hyprland
windowrule = float on, match:class polkit-gnome-authentication-agent-1
windowrule = float on, match:class hyprpolkitagent
windowrule = float on, match:class org.kde.polkit-kde-authentication-agent-1
windowrule = float on, match:class CachyOSHello
windowrule = float on, match:class zenity
windowrule = float on, match:title "Steam - Self Updater"

# Opacity rules
windowrule = opacity 0.92 0.92, match:class (thunar|nemo)
windowrule = opacity 0.96 0.96, match:class (discord|armcord|webcord)
windowrule = opacity 0.95 0.95, match:title (QQ|Telegram)
windowrule = opacity 0.95 0.95, match:title "NetEase Cloud Music Gtk4"

# General window rules
windowrule = float on, match:title Picture-in-Picture
windowrule = size 960 540, match:title Picture-in-Picture
windowrule = move 25% 50%, match:title Picture-in-Picture
windowrule = float on, match:title (imv|mpv|danmufloat|termfloat|nemo|ncmpcpp)
windowrule = size 960 540, match:title (imv|mpv|danmufloat|termfloat|nemo|ncmpcpp)
windowrule = move 25% 50%, match:title (imv|mpv|danmufloat|termfloat|nemo|ncmpcpp)
windowrule = pin on, match:title danmufloat
windowrule = rounding 5, match:title (danmufloat|termfloat)
windowrule = animation slide right, match:class (kitty|Alacritty)
windowrule = no_blur on, match:class org.mozilla.firefox
windowrule = float on, match:class java

# Decorations - FLOATING windows on workspaces fv1-10
windowrule = border_size 2, match:float 1, match:workspace w[fv1-10]
windowrule = border_color $cachylblue, match:float 1, match:workspace w[fv1-10]
windowrule = rounding 8, match:float 1, match:workspace w[fv1-10]

# Decorations - TILED windows on workspaces 1-10
windowrule = border_size 3, match:float 0, match:workspace f[1-10]
windowrule = rounding 4, match:float 0, match:workspace f[1-10]

# Workspace Rules (остаются без изменений)
workspace = w[tv1-10], gapsout:5, gapsin:3
workspace = f[1], gapsout:5, gapsin:3

# Layer Rules
layerrule = animation slide top, match:namespace logout_dialog
layerrule = animation slide down, match:namespace waybar
layerrule = animation fade 50%, match:namespace wallpaper

layerrule = blur on, match:namespace rofi
layerrule = animation slide top, match:namespace logo>
layerrule = animation slide down, match:namespace way>
layerrule = animation fade 50%, match:namespace wallp>
